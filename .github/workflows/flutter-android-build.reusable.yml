name: flutter-android-build-reusable

# Proves the Android project builds with the Flutter version pinned in pubspec.yaml.
# Flutter's Gradle plugin fails the build when AGP / Kotlin / Gradle are outside the
# range the SDK supports, so this checks Renovate's Android tooling sync too.
on:
  workflow_call:
    inputs:
      flutter_version_file:
        required: false
        type: string
        default: pubspec.yaml
        description: "File with an exact Flutter version (environment.flutter in pubspec.yaml), relative to the repo root."
      build_args:
        required: false
        type: string
        default: ""
        description: "Extra flutter build apk arguments, e.g. '--flavor development -t lib/main_development.dart'."
      java_version:
        required: false
        type: string
        default: "17"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ☕ Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ${{ inputs.flutter_version_file }}
          cache: true

      - name: 🤖 Build APK
        env:
          # Via env, not inline, to avoid expression injection. Unquoted below so it splits into arguments.
          BUILD_ARGS: ${{ inputs.build_args }}
        run: flutter build apk --debug $BUILD_ARGS
