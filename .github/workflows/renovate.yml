name: Renovate

on:
  # Disabled until shared_workflow's runner is turned off: two runners on the same App would
  # process the same repos at the same time.
  # schedule:
  #   # 03:17 Asia/Jakarta, inside the presets' "before 6am" window.
  #   - cron: "17 20 * * *"
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        env:
          # Global-only options (autodiscover, requireConfig, allowedCommands) live with the presets.
          # The tag is bumped by the regex manager in renovate.json.
          RENOVATE_GLOBAL_EXTENDS: '["github>ekawijayasusilo/proto_codecare_scripts//version-control/renovate-configs/runner#v1.0.0"]'
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.222.0
